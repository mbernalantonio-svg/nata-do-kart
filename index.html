<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
function h(tag, props, ...kids){
  const el=document.createElement(tag);
  for(const k in (props||{})){
    const v=props[k];
    if(k==="class") el.className=v;
    else if(k==="text") el.textContent=v;
    else if(k.startsWith("on")) el[k]=v;
    else if(v===true) el.setAttribute(k,"");
    else if(v!=null&&v!==false) el.setAttribute(k,v);
  }
  kids.flat(Infinity).forEach(c=>{ if(c==null||c===false) return; el.append(c.nodeType?c:document.createTextNode(String(c))); });
  return el;
}
const SVGNS="http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids){
  const el=document.createElementNS(SVGNS,tag);
  for(const k in (attrs||{})){ if(attrs[k]!=null) el.setAttribute(k,attrs[k]); }
  kids.flat().forEach(c=>{ if(c==null) return; el.append(c.nodeType?c:document.createTextNode(String(c))); });

}
function parseTime(str){
  let t=String(str==null?"":str).trim().replace(/\s+/g,"");
  if(!t) return null;
  let m=t.match(/^(\d+)['’:](\d{1,2})[.:,](\d{1,3})$/);
  if(m) return (+m[1])*60000+(+m[2])*1000+ +m[3].padEnd(3,"0");
  m=t.match(/^(\d{1,3})[.,](\d{1,3})$/);
  if(m) return (+m[1])*1000+ +m[2].padEnd(3,"0");
  return null;
}
function fmt(ms){
  if(ms==null||isNaN(ms)) return "–";
  const m=Math.floor(ms/60000), sec=(ms%60000)/1000;

}
function fmtGap(ms){ return (ms>=0?"+":"−")+(Math.abs(ms)/1000).toFixed(3); }
function fmtDate(d){ const p=String(d||"").split("-"); return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:String(d||""); }
const norm=n=>String(n||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().replace(/\s+/g," ").toLowerCase();

const condOf=r=>r&&CONDS[r.cond]?r.cond:"";

function mapKind(v){ const t=norm(v); if(!t) return ""; if(/volta/.test(t)||/lap/.test(t)) return "voltas"; if(/tomada|quali|classif|treino|pole/.test(t)) return "qualify"; if(/corrida|race|bateria|prova|final/.test(t)) return "corrida"; return KINDS[t]?t:""; }

function parseTimes(str){ return String(str||"").split(/[\s;]+/).filter(Boolean); }

function titleCase(v){
  const t=String(v==null?"":v).trim(); if(!t||t!==t.toUpperCase()) return t;
  const small=new Set(["de","da","do","dos","das","e"]);

/* ---------- state ---------- */
const claude=window.claude;
let db=null,user=null,sample=null,limits=null;
let me={id:null,name:""}, canWrite=null, canEdit=false;
let races=[], loaded=false, slowLoad=false, dbMissing=false;
let useSample=false;
const openIds=new Set();
const cmp={kind:"__all__",cond:"__all__",track:"__all__",layout:"__all__",classe:"__all__",selected:new Set(),init:false,a:"",b:""};
const form={date:today(),kind:"",cond:"",track:"",layout:"",session:"",note:"",source:"manual",rows:[]};
let dupArmed="";
let ctl=null, importing=false, importMsg={text:"",bad:false};

/* ---------- dados de exemplo (só na tela, nunca salvos) ---------- */
const SAMPLE=(function(){
  let seed=7; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
  const pilots=[["Bruno",0],["Carla",250],["Diego",420],["Elisa",610],["Fábio",830]];
  const places=[["Kartódromo Norte","Traçado 1",58400],["Kartódromo Aldeia","Pista longa",63100]];
  const dates=["2026-08-08","2026-08-22","2026-09-05","2026-09-19","2026-10-03","2026-10-17","2026-10-24","2026-11-01"];
  const out=[];
  dates.forEach((d,i)=>{
    const [tn,ly,base]=places[i%2]; const wet=(i===3||i===6); const pen=wet?4200:0;
    const present=pilots.filter(()=>rnd()>0.12);
    const mk=(kind,laps,extra)=>{
      const res=present.map(([n,sk])=>({name:n,best:Math.round(base+pen+sk-i*18+rnd()*520),laps}));
      res.sort((a,b)=>a.best-b.best).forEach((r,k)=>{r.pos=k+1;r.avg=r.best+Math.round(700+rnd()*500);});
      return Object.assign({id:"ex"+out.length,date:d,kind,track:tn,layout:ly,cond:wet?"molhada":"seca",note:"",source:"manual",by:null,createdAt:out.length,results:res,example:true},extra||{});
    };
    out.push(mk("corrida",20+(i%3)));
    if(i%2===0) out.push(mk("qualify",8));
  });
  const v=out[out.length-1]; // última atividade vira volta a volta de exemplo
  const vr=Object.assign({},v,{id:"exv",kind:"voltas",results:v.results.slice(0,3).map(r=>{ const times=Array.from({length:8},(_,k)=>Math.round(r.best+300+rnd()*900-(k===5?250:0))); const b=Math.min(...times); return {name:r.name,pos:r.pos,best:b,avg:Math.round(times.reduce((a,c)=>a+c,0)/times.length),laps:times.length,lapTimes:times}; })});
  out.push(vr);
  return out;
})();
/* ---------- unificação de grafias (kartódromo e traçado) ---------- */
const plain=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const TSTOP=new Set(["kartodromo","kartodromos","autodromo","internacional","race","tracks","track","kart","karting","circuito","pista","a","funcionar","de","do","da","dos","das","e","o","em"]);
const LSTOP=new Set(["circuito","tracado","layout","pista"]);
const toks=s=>[...new Set(plain(s).split(" ").filter(w=>w&&!TSTOP.has(w)))];
const lkey=s=>{ const w=plain(s).split(" ").filter(x=>x&&!LSTOP.has(x)); return w.length?w.join(" "):plain(s); };
function sameTrack(a,b){
  const A=toks(a),B=toks(b);
  if(!A.length||!B.length) return plain(a)===plain(b);
  const [S,L]=A.length<=B.length?[A,B]:[B,A];
  if(S.every(w=>L.includes(w))&&(S.length>=2||S[0].length<=4||S.length===L.length)) return true;
  const ini=L.filter(w=>!/^\d+$/.test(w)).map(w=>w[0]).join("");
  return S.length===1&&ini.length>=2&&(S[0]===ini||S[0]==="k"+ini);
}
function buildCanon(src){
  const tv=new Map();
  src.forEach(r=>{ const t=String(r.track||"").trim(); if(t) tv.set(t,(tv.get(t)||0)+1); });

  const dk=doc.date+"|"+doc.kind+"|"+norm(doc.track)+"|"+norm(doc.session);

  }

function compactTelemetry(text){
  if(text.length<=50000) return text;
  const lines=text.split(/\r?\n/);
  let hi=-1,sep=",";
  for(let i=0;i<Math.min(lines.length,300);i++){ const L=lines[i]; if(/lap/i.test(L)){ const c=[",",";","\t"].map(x=>[x,L.split(x).length]).sort((a,b)=>b[1]-a[1])[0]; if(c[1]>=3){hi=i;sep=c[0];break;} } }
  if(hi<0) return text.slice(0,60000);
  const cols=lines[hi].split(sep);
  let li=cols.findIndex(c=>/lap/i.test(c)&&/(num|number|#|^\W*lap\W*$)/i.test(c)); if(li<0) li=cols.findIndex(c=>/lap/i.test(c));
  const keep=lines.slice(Math.max(0,hi-20),hi+1); let prev=null;
  for(let i=hi+1;i<lines.length&&keep.length<700;i++){ const f=lines[i].split(sep); if(f[li]!==prev){keep.push(lines[i]);prev=f[li];} }
  if(lines.length) keep.push(lines[lines.length-1]);
  return keep.join("\n").slice(0,60000);
}
async function pdfToInput(file){
  if(typeof pdfjsLib==="undefined") throw {code:"nopdf"};
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const pages=pdf.numPages, n=Math.min(pages,12); let text="";
  for(let i=1;i<=n;i++){
    const page=await pdf.getPage(i); const tc=await page.getTextContent(); const lines=new Map();
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/3); if(!lines.has(y)) lines.set(y,[]); lines.get(y).push({x:it.transform[4],t:it.str}); });
    text+="--- página "+i+" ---\n"+[...lines.keys()].sort((a,b)=>b-a).map(y=>lines.get(y).sort((a,b)=>a.x-b.x).map(o=>o.t).join("  ")).join("\n")+"\n";
  }
  let images=null;
  if(text.replace(/---[^-]*---|\s/g,"").length<40 && limits&&limits.images){
    images=[]; const m=Math.min(pages,limits.images.maxCount);
    for(let i=1;i<=m;i++){
      const page=await pdf.getPage(i); const vp=page.getViewport({scale:1.6});
      const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height;
      await page.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise;
      images.push(await new Promise(r=>cv.toBlob(r,"image/jpeg",0.85)));
    }
  }
  return {text:text.slice(0,60000),images,pages,sent:images?images.length:0};
}
async function runImport(kind,files){

      if(!(limits&&limits.images)) throw {code:"images_unavailable"};
      images=files.slice(0,limits.images.maxCount);

    }else if(kind==="pdf"){

        _rep:x.melhor?parseTime(x.melhor):null,_lapsRep:(x.voltas!=null&&x.voltas!=="")?parseInt(x.voltas,10):null};

      const off=rows.filter(r=>r._min!=null&&((r._rep!=null&&r._rep!==r._min)||(r._lapsRep!=null&&!isNaN(r._lapsRep)&&r._lapsRep!==r._n))).map(r=>r.name);
      rows.sort((a,b)=>(a._min==null?9e12:a._min)-(b._min==null?9e12:b._min));
      rows.forEach((r,i)=>{ r.pos=String(i+1); });

    }

function leaderboard(rs){
  const m=new Map();
  rs.forEach(r=>(r.results||[]).forEach(x=>{
    const key=norm(x.name); if(!key) return;
    const e=m.get(key)||{key,name:x.name.trim(),best:null};
    if(x.best!=null&&(e.best==null||x.best<e.best)) e.best=x.best;
    m.set(key,e);
  }));
  return [...m.values()];
}

      showBest&&mixed?h("p",{class:"sub",style:"color:var(--warn)",text:"Seca e molhada estão misturadas. Filtre a condição para comparar tempos de volta."}):null,
      !showBest?h("p",{class:"sub",text:"Escolha kartódromo e traçado para ver a melhor volta."}):null),
    posGrid(rs,idx,showBest)));
  /* melhor volta */
  let ctx=null;
  if(showBest) ctx={track:cmp.track,layout:cmp.layout!=="__all__"?cmp.layout:(layouts[0]||""),races:rs};
  else{
    const cnt=new Map(); rs.forEach(r=>{ const k=(r.track||"").trim()+"||"+layoutOf(r); cnt.set(k,(cnt.get(k)||0)+1); });
    const top=[...cnt.entries()].sort((a,b)=>b[1]-a[1])[0];
    if(top){ const [t,l]=top[0].split("||"); ctx={track:t,layout:l,races:rs.filter(r=>(r.track||"").trim()===t&&layoutOf(r)===l)}; }

    h("div",null,h("h3",{text:"Melhor volta"}),h("p",{class:"sub",text:(ctx?ctx.track+(ctx.layout?" · "+ctx.layout:""):"")+(showBest?"":" (combinação com mais atividades)")+" · diferença para a volta mais rápida"})),

    chips,

  const sa=h("select",{id:"h-a",onchange:e=>{cmp.a=e.target.value;renderComparativo();}},pilots.map(p=>h("option",{value:p.key,text:p.name}))); sa.value=cmp.a;

    h("div",null,h("h3",{text:"Cara a cara"}),h("p",{class:"sub",text:"Só atividades em que os dois participaram, dentro dos filtros acima."})),
    h("div",{class:"grid2 stackable"},

      h("div",{class:"field"},h("label",{for:"h-b",text:"Piloto B"}),sb)),

function lapChart(bests,idx){
  const W=360,rowH=38,top=6,H=top+bests.length*rowH+4, x0=96, maxL=190;
  const lead=bests[0].best, maxGap=Math.max(...bests.map(b=>b.best-lead));
  const svg=s("svg",{class:"chart",viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Diferença da melhor volta de cada piloto para a mais rápida"});
  svg.append(s("line",{class:"grid",x1:x0,x2:x0,y1:top,y2:H-4}));
  bests.forEach((b,i)=>{
    const y=top+i*rowH, gap=b.best-lead, L=maxGap>0?Math.max(3,gap/maxGap*maxL):0, col=colorOf(idx.get(b.key)||0);
    svg.append(s("text",{class:"nm",x:0,y:y+15},b.name.length>13?b.name.slice(0,12)+"…":b.name));
    svg.append(s("text",{class:"tm",x:0,y:y+29},fmt(b.best)));
    if(i===0){ svg.append(s("circle",{cx:x0,cy:y+17,r:5,fill:col})); svg.append(s("text",{class:"gp",x:x0+11,y:y+21},"mais rápido")); }
    else{ svg.append(s("rect",{x:x0,y:y+9,width:L,height:16,rx:2,fill:col})); svg.append(s("text",{class:"gp",x:x0+L+6,y:y+21},fmtGap(gap))); }
  });
  return svg;
}
function posChart(chrono,idx){
  const W=360,L=24,R=62,T=14,B=26;
  const keys=[...cmp.selected].filter(k=>idx.has(k));
  const maxPos=Math.max(2,...chrono.flatMap(r=>(r.results||[]).filter(x=>keys.includes(norm(x.name))).map(x=>x.pos||0)));
  const rowH=28, H=T+(maxPos-1)*rowH+B, n=chrono.length;
  const xs=i=>L+(n>1?i*(W-L-R)/(n-1):0), ys=p=>T+(p-1)*rowH;
  const svg=s("svg",{class:"chart",viewBox:"0 0 "+W+" "+H,role:"img","aria-label":"Posição de cada piloto em cada corrida"});
  for(let p=1;p<=maxPos;p++){ svg.append(s("line",{class:"grid",x1:L,x2:W-R+6,y1:ys(p),y2:ys(p)})); svg.append(s("text",{x:L-8,y:ys(p)+4,"text-anchor":"end"},p)); }
  const step=Math.ceil(n/5);
  chrono.forEach((r,i)=>{ if(i%step===0||i===n-1){ const p=String(r.date||"").split("-"); svg.append(s("text",{x:xs(i),y:H-8,"text-anchor":"middle"},p.length===3?p[2]+"/"+p[1]:"")); } });
  const ends=[];
  keys.forEach(k=>{
    const col=colorOf(idx.get(k)); const pts=[]; let name="";
    chrono.forEach((r,i)=>{ const x=(r.results||[]).find(q=>norm(q.name)===k); if(x&&x.pos){ pts.push([xs(i),ys(x.pos)]); name=x.name.trim(); } });
    if(!pts.length) return;
    if(pts.length>1) svg.append(s("polyline",{points:pts.map(p=>p.join(",")).join(" "),fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round"}));
    pts.forEach((p,i)=>svg.append(s("circle",{cx:p[0],cy:p[1],r:i===pts.length-1?4.5:3,fill:col})));
    ends.push({y:pts[pts.length-1][1],name,col});
  });
  ends.sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<13) ends[i].y=ends[i-1].y+13;
  ends.forEach(e=>{ const t=s("text",{class:"nm",x:W-R+12,y:e.y+4},e.name.length>9?e.name.slice(0,8)+"…":e.name); t.style.fill=e.col; svg.append(t); });
  return svg;
}
function headToHead(chrono,pilots){
  const A=pilots.find(p=>p.key===cmp.a), B=pilots.find(p=>p.key===cmp.b);
  if(!A||!B||A.key===B.key) return h("p",{class:"sub",text:"Escolha dois pilotos diferentes."});
  const common=[];
  chrono.forEach(r=>{ const a=(r.results||[]).find(x=>norm(x.name)===A.key), b=(r.results||[]).find(x=>norm(x.name)===B.key); if(a&&b) common.push({r,a,b}); });
  if(!common.length) return h("p",{class:"sub",text:"Esses dois pilotos ainda não participaram juntos com esses filtros."});
  const aw=common.filter(c=>c.a.pos&&c.b.pos&&c.a.pos<c.b.pos).length, bw=common.filter(c=>c.a.pos&&c.b.pos&&c.b.pos<c.a.pos).length;

    h("div",{class:"h2h-sum"},
      h("div",null,h("div",{class:"n",style:"color:"+colorOf(ia),text:aw}),h("div",{class:"who",text:A.name})),
      h("div",{class:"vs",text:"à frente em "+common.length+(common.length===1?" atividade":" atividades")}),
      h("div",null,h("div",{class:"n",style:"color:"+colorOf(ib),text:bw}),h("div",{class:"who",text:B.name}))),
    h("div",{class:"tscroll"},h("table",null,
      h("thead",null,h("tr",null,h("th",{text:"Data"}),h("th",{text:"Atividade"}),h("th",{text:"Pos A"}),h("th",{text:"Pos B"}),h("th",{text:"Melhor A"}),h("th",{text:"Melhor B"}),h("th",{text:"A − B"}))),
      h("tbody",null,common.slice().reverse().map(c=>{
        const d=(c.a.best!=null&&c.b.best!=null)?c.a.best-c.b.best:null;
        return h("tr",null,h("td",{class:"t"},fmtDate(c.r.date).slice(0,5)),
          h("td",null,KINDS[kindOf(c.r)]+" · "+(c.r.track||"")+(layoutOf(c.r)?" · "+layoutOf(c.r):"")+(condOf(c.r)?" · "+(c.r.cond==="molhada"?"molhada":"seca"):"")),
          h("td",{class:"t"},c.a.pos??"–"),h("td",{class:"t"},c.b.pos??"–"),
          h("td",{class:"t"},fmt(c.a.best)),h("td",{class:"t"},fmt(c.b.best)),
          h("td",{class:"t delta "+(d==null?"":d<0?"neg":"pos")},d==null?"–":fmtGap(d)));})))),
    h("p",{class:"sub",text:"A − B negativo: o piloto A foi mais rápido."}));
}

renderAll();
(async function init(){

  try{ sample=await (claude&&claude.use?claude.use("sample"):null); }catch(e){ sample=null; }

  try{ db=await (claude&&claude.use?claude.use("db"):null); }catch(e){ db=null; }

  const timer=setTimeout(()=>{ if(!loaded){ slowLoad=true; renderBanners(); } },10000);
  db.collection("races").onSnapshot(snap=>{
    races=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(r=>r&&Array.isArray(r.results));
    if(!snap.metadata.fromCache){ loaded=true; clearTimeout(timer); slowLoad=false; }
